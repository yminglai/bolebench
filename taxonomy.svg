<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Sources feed one item bank; judges make pairwise comparisons; reality resolves">
  <style>
    .tx-t  { font-size: 16px; font-weight: 650; fill: var(--ink, #1C1A17); }
    .tx-m  { font-size: 13px; fill: var(--ink-2, #57534C); }
    .tx-leaf { fill: var(--tile-bg, #F7F5F1); stroke: var(--hairline, #E6E2DB); }
    .tx-line { stroke: var(--hairline, #E6E2DB); stroke-width: 1; }
    .tx-arr  { stroke: var(--ink-3, #8A857C); stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="tx-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="var(--ink-3, #8A857C)" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Sources -->
  <rect class="tx-leaf" x="20" y="40" width="300" height="190" rx="12"/>
  <text class="tx-t" x="40" y="74">Sources</text>
  <line class="tx-line" x1="40" y1="90" x2="300" y2="90"/>
  <text class="tx-m" x="40" y="118"><tspan font-weight="600" fill="var(--ink, #1C1A17)">benchmarks</tspan> — e.g. AI4AI-Bench</text>
  <text class="tx-m" x="40" y="148"><tspan font-weight="600" fill="var(--ink, #1C1A17)">arXiv papers</tspan> — their own ablations</text>
  <text class="tx-m" x="40" y="178"><tspan font-weight="600" fill="var(--ink, #1C1A17)">&#8230; anything</tspan> with several real</text>
  <text class="tx-m" x="40" y="196">attempts at the same goal</text>

  <!-- Item bank -->
  <rect class="tx-leaf" x="390" y="40" width="250" height="190" rx="12"/>
  <text class="tx-t" x="410" y="74">Item bank</text>
  <line class="tx-line" x1="410" y1="90" x2="620" y2="90"/>
  <text class="tx-m" x="410" y="118">two attempts, same task,</text>
  <text class="tx-m" x="410" y="138">described up to the decision point</text>
  <text class="tx-m" x="410" y="168">identities &#183; scores &#183; outcomes</text>
  <text class="tx-m" x="410" y="188">stripped</text>

  <!-- Pairwise comparison -->
  <rect class="tx-leaf" x="710" y="40" width="270" height="190" rx="12"/>
  <text class="tx-t" x="730" y="74">Pairwise comparison</text>
  <line class="tx-line" x1="730" y1="90" x2="960" y2="90"/>
  <text class="tx-m" x="730" y="118">the judge — model or human —</text>
  <text class="tx-m" x="730" y="138">picks A or B, with confidence</text>
  <text class="tx-m" x="730" y="172"><tspan font-weight="600" fill="var(--accent, #A93226)">reality resolves</tspan> — the attempt</text>
  <text class="tx-m" x="730" y="192">that actually scored higher wins</text>

  <!-- arrows -->
  <path class="tx-arr" d="M320,135 L388,135" marker-end="url(#tx-ah)"/>
  <path class="tx-arr" d="M640,135 L708,135" marker-end="url(#tx-ah)"/>

  <!-- one quiet footer line -->
  <text class="tx-m" x="20" y="272" fill="var(--ink-3, #8A857C)">Any source qualifies with one problem, two or more attempts, and one reality-resolved number.</text>
</svg>
